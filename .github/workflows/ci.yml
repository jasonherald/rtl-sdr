name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libgtk-4-dev libadwaita-1-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libclang-dev libdbus-1-dev
      - name: Install cargo tools
        run: cargo install --locked cargo-deny cargo-audit

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: cargo-deny
        run: cargo deny check

      - name: cargo-audit
        run: cargo audit

  sherpa-check:
    name: Sherpa backends check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
        with:
          # Share cache between sherpa-cpu and sherpa-cuda runs, but keep
          # it separate from the main `check` job's cache because the
          # sherpa-onnx sys crate downloads a different prebuilt archive
          # under each link mode.
          key: sherpa-backends
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libgtk-4-dev libadwaita-1-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libclang-dev libdbus-1-dev

      # `cargo check` does not invoke the linker, so the CUDA variant
      # works on a runner without CUDA/cuDNN installed. The build.rs
      # download of the 235 MB CUDA prebuilt archive still runs on the
      # first cold cache and is the main cost of this job.

      - name: cargo check (sherpa-cpu)
        run: cargo check --workspace --locked --no-default-features --features sherpa-cpu

      - name: cargo check (sherpa-cuda)
        run: cargo check --workspace --locked --no-default-features --features sherpa-cuda

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      # The default `check` job runs deny under the whisper-cpu feature
      # graph, which doesn't see the sherpa-onnx git source. Re-run deny
      # here under the sherpa-cuda graph so the fork allowlist entry in
      # deny.toml is actually exercised by CI.
      - name: cargo-deny (sherpa-cuda graph)
        run: cargo deny --no-default-features --features sherpa-cuda check sources

  # Coverage gate for the sdr-lrpt crate (epic #469). Pure-data
  # crate with no GTK / async surface, so a high threshold is
  # achievable without contortion. Since the test modules moved to
  # sibling `tests.rs` files (epic #832) the measurement is
  # production code only — the inline test bodies no longer pad the
  # numerator — which is why the line threshold is 88 rather than
  # the original 90 (regions stay at 90). `lib.rs` at ~84 % is the
  # known gap; raise the bar back once it is covered.
  coverage:
    name: Coverage gate (sdr-lrpt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libgtk-4-dev libadwaita-1-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libclang-dev libdbus-1-dev
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Coverage gate
        run: |
          cargo llvm-cov --package sdr-lrpt \
            --fail-under-lines 88 \
            --fail-under-regions 90

  # Workspace coverage → Codacy (#796). Codacy is on trial as the
  # SonarCloud replacement; this feeds its coverage dashboard. Runs
  # the default (Whisper CPU) feature set — the transcription backend
  # mutex means exactly one backend per build. This job executes
  # workspace code (build scripts, tests) and therefore never sees the
  # Codacy token: the report travels to a separate upload job as an
  # artifact, so a compromised build script cannot reach the token
  # (e.g. by appending `BASH_ENV=` to `$GITHUB_ENV`).
  codacy-coverage:
    name: Coverage report (Codacy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Untrusted PR code runs in this job; it needs no git credentials.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake \
            libgtk-4-dev libadwaita-1-dev libusb-1.0-0-dev \
            libpipewire-0.3-dev libclang-dev libdbus-1-dev
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Workspace coverage (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 7

  # Upload-only job: no checkout, no workspace code — just the LCOV
  # artifact and a pinned, checksum-verified reporter binary. Skips
  # the upload when `CODACY_PROJECT_TOKEN` is not configured (forks,
  # or before the secret exists) instead of failing the workflow.
  codacy-upload:
    name: Coverage upload (Codacy)
    needs: codacy-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Only a presence flag at job scope (a step's own `env` is not
      # visible to its own `if`); the token itself is scoped to the
      # upload step.
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lcov
      # The official action is SHA-pinned only for its action.yml; it
      # then bootstraps `get.sh` from the reporter repo's mutable
      # `master` branch and hands the token to whatever that fetched.
      # Fetch a pinned release of the reporter instead and verify it
      # against a checksum recorded here before the token is exposed.
      - name: Upload to Codacy
        if: ${{ env.HAS_CODACY_TOKEN == 'true' }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          REPORTER_VERSION: 14.1.3
          REPORTER_SHA512: 73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o codacy-coverage-reporter \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${REPORTER_VERSION}/codacy-coverage-reporter-linux"
          echo "${REPORTER_SHA512}  codacy-coverage-reporter" | sha512sum -c -
          chmod +x codacy-coverage-reporter
          ./codacy-coverage-reporter report -r lcov.info
