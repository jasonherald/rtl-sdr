# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[output]
feature-depth = 1

# =============================================================================
# Advisories — check for known vulnerabilities
# =============================================================================
[advisories]
ignore = [
    # `zvariant`, `zvariant_derive` and `zbus_names` were folded into `zbus`
    # itself and are no longer maintained as standalone crates (advisories
    # dated 2026-10-16). They are "unmaintained" notices, not
    # vulnerabilities, and have no upgrade path from here: they arrive via
    # zbus 5, which `ksni` (the tray icon) and `secret-service` (the
    # keyring's Linux backend) both still require. Revisit when those move
    # to a zbus release that drops the standalone crates.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus); transitive via zbus 5, no upgrade path yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus); transitive via zbus 5, no upgrade path yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus); transitive via zbus 5, no upgrade path yet" },
]

# =============================================================================
# Licenses — only allow known-good open source licenses
# =============================================================================
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    # `bzip2-1.0.6` is the pure-Rust `libbz2-rs-sys` backend that bzip2 0.6
    # pulls in by default (replacing the C `bzip2-sys`). It's the permissive
    # BSD-style bzip2/libbzip2 license — GPL-compatible, so it links cleanly
    # into this GPL-2.0-or-later app. Per #682.
    "bzip2-1.0.6",
    # `LGPL-2.0-only` is `sdr-acars` — the spun-out acarsdec port, whose
    # upstream license is the GNU Library GPL v2 with no "or later" grant.
    # Linkable into this GPL-2.0-or-later app: LGPL→GPL is a permitted
    # one-way upgrade per the LGPL's own terms.
    "LGPL-2.0-only",
    "LGPL-2.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    # GPL is required because librtlsdr-rs (and therefore this app, since
    # GPL is viral across the linked binary) is GPL-2.0-or-later.
    "GPL-2.0",
    "GPL-2.0-or-later",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

# =============================================================================
# Bans — prevent unwanted or duplicate crates
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # AGPL-licensed — incompatible with MIT
    { crate = "sieve-rs", reason = "AGPL-3.0 licensed" },
    # OpenSSL/native-tls banned — no C TLS dependencies
    { crate = "openssl", reason = "OpenSSL is disallowed in this workspace" },
    { crate = "openssl-sys", reason = "OpenSSL is disallowed in this workspace" },
    { crate = "native-tls", reason = "native-tls is disallowed; use rustls if needed" },
]
skip = []
skip-tree = []

# =============================================================================
# Sources — only allow crates from crates.io, plus explicitly-pinned
# git deps that are tracked as temporary overrides in workspace
# Cargo.toml (see the `sherpa-onnx` comment in the root Cargo.toml for
# the re-unification plan once upstream merges).
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # `sherpa-onnx` is pinned to jasonherald/sherpa-onnx while the `cuda`
    # feature awaits upstream merge into k2-fsa/sherpa-onnx. Switch back
    # to a crates.io version pin once upstream ships a release with the
    # cuda feature, and remove this entry at that time.
    #
    # This allowlist entry is only exercised by cargo-deny runs under
    # sherpa-* feature graphs (see the sherpa-check job in ci.yml); the
    # default `check` job uses the whisper-cpu graph and will not see
    # this git source, so an "unmatched-source" warning there is
    # expected and harmless.
    "https://github.com/jasonherald/sherpa-onnx",
]
